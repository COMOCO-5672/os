# GRUB 配置 —— 由 grub-mkrescue 打进 ISO
#
# timeout=0 : 立即启动默认项, 适合快速迭代与自动化验证
#            想看到菜单就改成 5

# 把 GRUB 自己的输出也接到串口 —— 无窗口调试时必须打开,
# 否则 GRUB 加载失败时你只会看到一片空白
serial --unit=0 --speed=115200
terminal_input  serial console
terminal_output serial console

set timeout=0
set default=0

menuentry "os (multiboot2)" {
    multiboot2 /boot/kernel.elf
    boot
}
